name: Release Build
on: 
  create:
    tags:
      - 'v*'
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            os_short: windows
            compiler_cc: msvc-vs2022
            artifact_suffix: windows-vs2022
          - os: windows-2022
            os_short: windows
            compiler_cc: msvc-vs2019
            artifact_suffix: windows-vs2019
          - os: ubuntu-latest
            os_short: linux
            compiler_cc: clang
            compiler_cxx: clang++
            artifact_suffix: linux-clang
          - os: ubuntu-22.04
            os_short: linux
            compiler_cc: clang-14
            compiler_cxx: clang++-14
            compiler_install: clang-14
            artifact_suffix: linux-clang14
      fail-fast: false
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os_short }}-${{ matrix.compiler_cc }}
    env:
      SDKS: '["cs2"]'
      DEPENDENCIES_FOLDER: dependencies
      DEPENDENCIES_ROOT: ${{ github.workspace }}/dependencies
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
          path: metamod-source
      
      - name: Select HL2SDKs
        run: echo 'SDKS=["cs2"]' >> $GITHUB_ENV

      - name: Cache dependencies
        uses: actions/cache@v3
        env:
          cache-name: hl2sdk
        with:
          path: ${{ env.DEPENDENCIES_ROOT }}
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ join(fromJSON(env.SDKS), '') }}
          restore-keys: ${{ runner.os }}-build-${{ env.cache-name }}-

      # Setup Python for AMBuild
      - uses: actions/setup-python@v4
        name: Setup Python 3.12
        with:
          python-version: 3.12
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        shell: bash
        run: |
          mkdir -p ${{ env.DEPENDENCIES_FOLDER }}
          cd ${{ env.DEPENDENCIES_FOLDER }}

          # Satisfy checkout-deps requirement for a "metamod-source" folder.
          mkdir -p metamod-source
          ../metamod-source/support/checkout-deps.sh -s ${{ join(fromJSON(env.SDKS)) }}

      - name: Install Linux dependencies
        if: startsWith(runner.os, 'Linux')
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-multilib g++-multilib libstdc++6 lib32stdc++6 \
            libc6-dev libc6-dev-i386 linux-libc-dev \
            linux-libc-dev:i386 lib32z1-dev ${{ matrix.compiler_install }}

      - name: Select clang compiler
        if: startsWith(runner.os, 'Linux') || startsWith(runner.os, 'macOS')
        run: |
          echo "CC=${{ matrix.compiler_cc }}" >> $GITHUB_ENV
          echo "CXX=${{ matrix.compiler_cxx }}" >> $GITHUB_ENV
          ${{ matrix.compiler_cc }} --version
          ${{ matrix.compiler_cxx }} --version

      - name: Build
        working-directory: metamod-source
        run: |
          mkdir build
          cd build
          python ../configure.py --enable-optimize --sdks=${{ join(fromJSON(env.SDKS)) }} --hl2sdk-root=${{ env.DEPENDENCIES_ROOT }}
          ambuild

      - name: Test SourceHook (Optimized)
        working-directory: metamod-source
        shell: bash
        # SourceHook tests are busted on Windows
        continue-on-error: ${{ startsWith(runner.os, 'Windows') }}
        run: |
          mkdir build-sh-opt && cd build-sh-opt
          python ../configure.py --enable-optimize --enable-tests --sdks=
          ambuild
          cd ./core/sourcehook/test/test_sourcehook
          if [ -d "${{ matrix.os_short }}-x86" ]; then
            ./${{ matrix.os_short }}-x86/test_sourcehook -v
          fi
          if [ -d "${{ matrix.os_short }}-x86_64" ]; then
            ./${{ matrix.os_short }}-x86_64/test_sourcehook -v
          fi

      - name: Test SourceHook (Debug)
        working-directory: metamod-source
        shell: bash
        # SourceHook tests are busted on Windows
        continue-on-error: ${{ startsWith(runner.os, 'Windows') }}
        run: |
          mkdir build-sh-debug && cd build-sh-debug
          python ../configure.py --enable-debug --enable-tests --sdks=
          ambuild
          cd ./core/sourcehook/test/test_sourcehook
          if [ -d "${{ matrix.os_short }}-x86" ]; then
            ./${{ matrix.os_short }}-x86/test_sourcehook -v
          fi
          if [ -d "${{ matrix.os_short }}-x86_64" ]; then
            ./${{ matrix.os_short }}-x86_64/test_sourcehook -v
          fi

      - name: Package artifacts
        shell: bash
        working-directory: metamod-source
        run: |
          # Create release package
          mkdir -p release-package
          
          # Copy built binaries and important files
          find build -name "*.so" -o -name "*.dll" -o -name "*.dylib" | xargs -I {} cp {} release-package/ 2>/dev/null || true
          
          # Copy additional files if they exist
          [ -f README.md ] && cp README.md release-package/
          [ -f LICENSE ] && cp LICENSE release-package/
          [ -f CHANGELOG.md ] && cp CHANGELOG.md release-package/
          
          # Create archive
          if [[ "${{ matrix.os_short }}" == "windows" ]]; then
            7z a metamod-${{ matrix.artifact_suffix }}.zip release-package/*
          else
            tar -czf metamod-${{ matrix.artifact_suffix }}.tar.gz -C release-package .
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: metamod-${{ matrix.artifact_suffix }}
          path: |
            metamod-source/metamod-${{ matrix.artifact_suffix }}.zip
            metamod-source/metamod-${{ matrix.artifact_suffix }}.tar.gz
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
